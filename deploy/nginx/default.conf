# Única puerta de entrada para los equipos de la sala (puerto 80).
#   /      -> pantallas de Angular
#   /api/  -> API (NestJS); Nginx le quita el prefijo /api

server {
    listen 80;
    server_name _;

    # Material de apoyo: la API acepta archivos de hasta 10 MB; se deja un margen.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular (/inicio, /guias/...): siempre devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
