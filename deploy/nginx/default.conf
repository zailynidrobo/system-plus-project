# Única puerta de entrada para los equipos de la sala (puerto 80).
#   /      -> pantallas de Angular
#   /api/  -> API (NestJS); Nginx le quita el prefijo /api

server {
    listen 80;
    server_name _;

    # No anunciar la versión de Nginx en errores ni encabezados.
    server_tokens off;

    # Material de apoyo: la API acepta archivos de hasta 10 MB; se deja un margen.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Encabezados de seguridad. Van repetidos en cada location porque Nginx no hereda add_header
    # cuando una location define los suyos.
    #   nosniff: el navegador no adivina tipos de archivo.
    #   SAMEORIGIN: otra página no puede mostrar el sistema dentro de un marco (clickjacking).
    #   CSP: solo se ejecuta código servido por este mismo servidor. Los estilos en línea los necesita Angular.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rutas de Angular (/inicio, /guias/...): siempre devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
