# System Plus en la intranet de la sala.
# Uso: copiar intranet.env.example como .env, ajustar contraseñas y ejecutar
#   docker compose up -d
# Los equipos de la sala entran a http://<IP-del-servidor>

name: systemplus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      # Solo la API habla con Keycloak, por la red interna de Docker y sin HTTPS.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # Un solo servidor: sin clúster.
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=25"
    volumes:
      - ./keycloak/system-plus-realm.json:/opt/keycloak/data/import/system-plus-realm.json:ro
    # Consola de administración solo desde el propio servidor: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    image: systemplus/api:${VERSION:-1.0}
    build: ./gestion-guias
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/system-plus
      KEYCLOAK_AUDIENCE: system-plus-api
      KEYCLOAK_ADMIN_CLIENT_ID: system-plus-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_API_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # El proyecto aún no tiene migraciones: TypeORM crea y actualiza las tablas al iniciar.
      DB_SYNCHRONIZE: "true"
      LIBREOFFICE_PATH: soffice
      # La API está detrás de Nginx: la auditoría toma la IP real del equipo desde X-Forwarded-For.
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web:
    image: systemplus/web:${VERSION:-1.0}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  db-data:
